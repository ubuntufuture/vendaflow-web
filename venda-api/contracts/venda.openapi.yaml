          maxLength: 120
        timezone:
          type: string
          maxLength: 100
        locale:
          type: string
          enum:
            - pt-BR
        currency:
          type: string
          enum:
            - BRL
        createdAt: &a42
          type: string
          format: date-time
    Membership:
      type: object
      additionalProperties: false
      required:
        - id
        - organizationId
        - userId
        - role
        - active
        - createdAt
      properties:
        id: *a41
