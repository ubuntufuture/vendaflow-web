      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        timezone:
          type: string
          maxLength: 100
    CreateMembership:
      type: object
      additionalProperties: false
      required:
        - userId
        - role
      properties:
        userId: *a53
        role: *a55
    UpdateMembership:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
